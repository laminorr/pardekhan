<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2e5d50">
    <title>آفلاین — پرده‌خوان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
            direction: rtl;
            color: #f1f4f3;
            background: #2e5d50;
            background: linear-gradient(160deg, #3f7a68 0%, #2e5d50 55%, #1f4d40 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }
        .box {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .icon {
            width: 96px;
            height: 96px;
            border-radius: 26px;
            margin: 0 auto 1.6rem;
            display: block;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
            background: rgba(255, 255, 255, 0.08);
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.7rem;
        }
        p {
            font-size: 0.95rem;
            color: rgba(241, 244, 243, 0.82);
            margin-bottom: 1.8rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 170px;
            padding: 0.9rem 1.4rem;
            border: none;
            border-radius: 15px;
            background: #ffffff;
            color: #1f4d40;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
            transition: transform 0.15s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn svg { display: block; }
    </style>
</head>
<body>
    <div class="box">
        <img class="icon" src="/pwa/icon-192.png" alt="پرده‌خوان" width="96" height="96">
        <h1>ارتباط با اینترنت قطع است</h1>
        <p>لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
        <button class="btn" type="button" onclick="location.reload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 4v6h-6"></path>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            تلاش دوباره
        </button>
    </div>
</body>
</html>
